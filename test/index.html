<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase 테스트</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🔥 Firebase 테스트 페이지</h1>

    <p id="status">연결 확인 중...</p>

    <script type="module" src="script.js"></script>

    <input type="file" id="photo">

<br><br>

<label>작성자</label>
<br>

<input
    type="text"
    id="family"
    placeholder="예: 창수">

<br><br>

<label>메모</label>
<br>

<textarea
    id="memo"
    rows="4"
    cols="40"
    placeholder="메모를 입력하세요"></textarea>

<br><br>

<button id="uploadBtn">
    사진 업로드
</button>

<br><br>

<img
    id="preview"
    width="300"
    style="display:none; border-radius:10px;">

<p id="photoUrl"></p>

<script src="https://cdn.jsdelivr.net/npm/exifreader/dist/exif-reader.min.js"></script>
<script type="module" src="script.js"></script>

</body>
</html>
