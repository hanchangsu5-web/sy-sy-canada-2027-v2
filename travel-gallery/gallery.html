<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Gallery</title>

    <!-- Common -->
    <link rel="stylesheet" href="css/common.css">

    <!-- Gallery -->
    <link rel="stylesheet" href="css/gallery.css">

    <!-- Viewer -->
    <link rel="stylesheet" href="css/viewer.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- ========================= -->
    <!-- Header -->
    <!-- ========================= -->

    <header class="page-header">

    <h1 class="gallery-title">
        Gallery
    </h1>

</header>

<div class="gallery-toolbar">

    <div class="gallery-option">

    <select id="viewMode">

        <option value="all" selected>
            전체 사진
        </option>

        <option value="favorite">
            즐겨찾기
        </option>

    </select>

</div>

    <div class="gallery-option">

    <select id="sortMode">

        <option value="takenDesc" selected>
            촬영일 최신순
        </option>

        <option value="takenAsc">
            촬영일 오래된순
        </option>

        <option value="uploadDesc">
            업로드순
        </option>

        <option value="owner">
            업로드한 사람
        </option>

    </select>

</div>

</div>

        </div>

    </header>

    <!-- ========================= -->
    <!-- Main -->
    <!-- ========================= -->

    <main id="galleryPage">

        <!-- ========================= -->
        <!-- Gallery -->
        <!-- ========================= -->

        <section id="gallerySection">

            <!-- Gallery Grid -->
            <div id="galleryGrid">

                <!--
                    Photo Card는 gallery.js가
                    동적으로 추가한다.
                -->

            </div>

            <!-- Empty Message -->

            <div id="emptyGallery" class="hidden">

                <p>사진이 없습니다.</p>

            </div>

            <!-- Gallery Loading -->

            <div id="galleryLoading" class="hidden">

                <div class="spinner"></div>

            </div>

        </section>

        <!-- ========================= -->
        <!-- Viewer -->
        <!-- ========================= -->

        <section id="viewerOverlay" class="hidden">

            <!-- Viewer Toolbar -->

            <header id="viewerToolbar">

                <button id="downloadButton" title="다운로드">
                    ⬇
                </button>

                <button id="shareButton" title="공유">
                    ↗
                </button>

                <button id="favoriteButton" title="즐겨찾기">
                    ♥
                </button>

                <button id="infoButton" title="정보">
                    ⓘ
                </button>

                <!-- 내 사진일 때만 표시 -->

                <button id="deleteButton"
                        class="hidden"
                        title="삭제">
                    🗑
                </button>

                <button id="closeViewerButton"
                        title="닫기">
                    ✕
                </button>

            </header>

            <!-- Viewer Content -->

            <div id="viewerContent">

                <button id="previousButton"
                        class="viewer-nav">
                    ◀
                </button>

                <img
                    id="viewerImage"
                    src=""
                    alt="Travel Photo">

                <button id="nextButton"
                        class="viewer-nav">
                    ▶
                </button>

            </div>

            <!-- ========================= -->
            <!-- Information Panel -->
            <!-- ========================= -->

            <section id="informationPanel" class="hidden">

                <div id="informationHandle"></div>

                <div id="informationContent">

                    <div class="information-row">
                        <div class="information-label">파일명</div>
                        <div id="informationFileName"></div>
                    </div>

                    <div class="information-row">
                        <div class="information-label">작성자</div>
                        <div id="informationOwner"></div>
                    </div>

                    <div class="information-row">
                        <div class="information-label">해상도</div>
                        <div id="informationResolution"></div>
                    </div>

                    <div class="information-row">
                        <div class="information-label">파일크기</div>
                        <div id="informationFileSize"></div>
                    </div>

                    <div class="information-row">

                        <div class="information-label">메모</div>

                        <textarea
                            id="informationMemo"
                            rows="4"
                            placeholder="메모를 입력하세요."></textarea>

                        <div class="information-counter">

                            <span id="memoLength">0</span>

                            /5000

                        </div>

                    </div>

                    <button id="openGoogleMapButton">

    🗺️ Google 지도 보기

</button>

                    <div class="information-actions">

                        <button id="saveMemoButton">
                            저장
                        </button>

                    </div>

                </div>

            </section>

            <!-- ========================= -->
            <!-- Viewer Loading -->
            <!-- ========================= -->

            <div id="viewerLoading" class="hidden">

                <div class="spinner"></div>

            </div>

        </section>

    </main>

    <script type="module" src="js/app.js"></script>

</body>

</html>
